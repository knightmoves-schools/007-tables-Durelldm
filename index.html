<html>

<head>

    <title>Table Example</title>

    <style>

        table {

            width: 60%;

            border-collapse: collapse;

            margin: 20px auto;

        }

        th, td {

            border: 1px solid black;

            padding: 10px;

            text-align: center;

        }

        th {

            background-color: #f2f2f2;

        }

    </style>

</head>

<body>



<h2 style="text-align:center;">Student Table</h2>



<table>

    <tr>

        <th>ID</th>

        <th>Name</th>

        <th>Age</th>

        <th>Grade</th>

    </tr>

    <tr>

        <td>1</td>

        <td>John</td>

        <td>18</td>

        <td>A</td>

    </tr>

    <tr>

        <td>2</td>

        <td>Mary</td>

        <td>17</td>

        <td>B</td>

    </tr>

    <tr>

        <td>3</td>

        <td>David</td>

        <td>18</td>

        <td>A</td>

    </tr>

</table>



</body>

</html>
